name: Frontend image and VPS deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image namespace
        env:
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
        run: |
          test -n "$GHCR_NAMESPACE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REACT_API_URL=https://shopinmada.com/api/api/v1/
            REACT_API_CATEGORY_URL=https://shopinmada.com/api1/api/v1/
          tags: |
            ghcr.io/${{ vars.GHCR_NAMESPACE }}/shopinmada-frontend:latest
            ghcr.io/${{ vars.GHCR_NAMESPACE }}/shopinmada-frontend:${{ github.sha }}

      - name: Deploy frontend on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/shopinmada
            export FRONTEND_TAG=${{ github.sha }}
            flock -w 300 /tmp/shopinmada-deploy.lock sh -c '
              set -eu
              docker compose pull frontend
              docker compose up -d --no-build frontend
            '
